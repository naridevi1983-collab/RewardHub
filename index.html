<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        .header {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: white;
            padding: 20px;
            border-radius: 0 0 20px 20px;
        }
        .wallet-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wallet {
            font-size: 24px;
            font-weight: bold;
        }
        .withdraw-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .withdraw-btn:disabled {
            background-color: #ccc;
        }
        .limit-text {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.9;
        }
        .task-container {
            padding: 15px;
        }
        .task-card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:disabled {
            background-color: #ccc;
        }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="header">
        <h2>⚡ Reward Hub</h2>
        <div class="wallet-box">
            <div>
                <p style="margin: 0;">Wallet Balance</p>
                <span class="wallet" id="walletBalance">₹0.00</span>
                <div class="limit-text">Min. Withdrawal: ₹250.00</div>
            </div>
            <button class="withdraw-btn" id="withdrawBtn" onclick="requestWithdrawal()" disabled>Withdraw</button>
        </div>
    </div>

    <div class="task-container" id="taskList">
        <!-- Tasks will be loaded here -->
    </div>

    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBDVSalGAeUbSzoVvAILMeTuxwC3eFVRPg",
            authDomain: "rewardhub-f9889.firebaseapp.com",
            databaseURL: "https://rewardhub-f9889-default-rtdb.firebaseio.com",
            projectId: "rewardhub-f9889",
            storageBucket: "rewardhub-f9889.firebasestorage.app",
            messagingSenderId: "866755432543",
            appId: "1:866755432543:web:5d10856a782badb03fcbea",
            measurementId: "G-Q9CLK7H3QE"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let balance = 0.00;
        let completedTasks = {};
        const minWithdrawal = 250.00;
        const userId = "default_user"; 

        const tasks = [
            { id: 1, name: "PhonePe", reward: 5.00, url: "https://play.google.com/store/apps/details?id=com.phonepe.app" },
            { id: 2, name: "Paytm", reward: 5.00, url: "https://play.google.com/store/apps/details?id=net.one97.paytm" },
            { id: 3, name: "Google Pay", reward: 5.00, url: "https://play.google.com/store/apps/details?id=com.google.android.apps.nbu.paisa.user" },
            { id: 4, name: "Zomato", reward: 5.00, url: "https://play.google.com/store/apps/details?id=com.application.zomato" },
            { id: 5, name: "Swiggy", reward: 5.00, url: "https://play.google.com/store/apps/details?id=in.swiggy.android" }
        ];

        // Load User Data & Completed Tasks from Firebase Database
        function loadUserData() {
            db.ref('users/' + userId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.balance !== undefined) {
                        balance = data.balance;
                        document.getElementById('walletBalance').innerText = `₹${balance.toFixed(2)}`;
                        if (balance >= minWithdrawal) {
                            document.getElementById('withdrawBtn').disabled = false;
                        }
                    }
                    if (data.completedTasks) {
                        completedTasks = data.completedTasks;
                    }
                }
                renderTasks();
            });
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            container.innerHTML = "";
            tasks.tasks ? tasks : tasks.forEach(task => {
                const isCompleted = completedTasks[task.id] === true;
                container.innerHTML += `
                    <div class="task-card">
                        <div>
                            <strong>${task.name}</strong><br>
                            <small>Install & Open • Earn ₹${task.reward.toFixed(2)}</small><br>
                            <span id="timer-${task.id}" style="color: ${isCompleted ? '#27ae60' : '#e67e22'}; font-size: 12px; font-weight: bold;">
                                ${isCompleted ? 'Completed' : ''}
                            </span>
                        </div>
                        <button class="btn" id="btn-${task.id}" ${isCompleted ? 'disabled style="background-color: #ccc;"' : ''} onclick="startTask(${task.id}, '${task.url}', ${task.reward})">
                            ${isCompleted ? 'Done' : 'Start'}
                        </button>
                    </div>
                `;
            });
        }

        function startTask(id, targetUrl, rewardAmount) {
            if (completedTasks[id]) return; // Prevent multiple clicks if already completed

            const btn = document.getElementById(`btn-${id}`);
            const timerText = document.getElementById(`timer-${id}`);
            btn.disabled = true;
            
            window.open(targetUrl, '_blank');

            let timeLeft = 15; 
            let countdown = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerText.innerText = "Verified!";
                    timerText.style.color = "#27ae60";
                    balance += rewardAmount;
                    completedTasks[id] = true; // Mark task as completed
                    
                    // Save updated balance and completed tasks to Firebase Realtime Database
                    db.ref('users/' + userId).set({
                        balance: balance,
                        completedTasks: completedTasks
                    });

                    document.getElementById('walletBalance').innerText = `₹${balance.toFixed(2)}`;
                    btn.innerText = "Done";
                    
                    if (balance >= minWithdrawal) {
                        document.getElementById('withdrawBtn').disabled = false;
                    }
                    
                    alert(`Verification Successful! ₹${rewardAmount.toFixed(2)} added to your wallet.`);
                } else {
                    timerText.innerText = `Verifying... ${timeLeft}s`;
                    timeLeft--;
                }
            }, 1000);
        }

        function requestWithdrawal() {
            if (balance >= minWithdrawal) {
                alert("Withdrawal request submitted successfully!");
            } else {
                alert("Minimum withdrawal amount is ₹250.00");
            }
        }

        window.onload = function() {
            loadUserData();
        };
    </script>
</body>
</html>

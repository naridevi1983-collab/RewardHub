<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Hub</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0f2f5;
            color: #333;
            padding: 15px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .wallet-box h3 {
            font-size: 14px;
            opacity: 0.9;
        }
        .wallet-box h2 {
            font-size: 24px;
            margin-top: 5px;
        }
        .withdraw-btn {
            background: #ff5e62;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .task-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .task-info h4 {
            font-size: 16px;
            color: #222;
        }
        .task-info p {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
        .task-reward {
            font-size: 14px;
            font-weight: bold;
            color: #00b894;
            margin-top: 4px;
        }
        .action-btn {
            background: #0984e3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .action-btn:disabled {
            background: #b2bec3;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="app-title">
            <h2>⚡ Reward Hub</h2>
            <p style="font-size: 12px; margin-top: 3px;">Min. Withdrawal: ₹250.00</p>
        </div>
        <div class="wallet-box" style="text-align: right;">
            <h3>Wallet Balance</h3>
            <h2 id="walletBalance">₹0.00</h2>
            <button class="withdraw-btn" onclick="requestWithdrawal()">Withdraw</button>
        </div>
    </div>

    <div class="section-title">Today's Automated Tasks</div>

    <div id="taskList">
        <div class="loading">Loading today's fresh tasks...</div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBDVSalGAeUbSzovVAILMeTuxwC3eFVRPg",
            authDomain: "rewardhub-f9889.firebaseapp.com",
            databaseURL: "https://rewardhub-f9889-default-rtdb.firebaseio.com",
            projectId: "rewardhub-f9889",
            storageBucket: "rewardhub-f9889.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Unique User ID Generate or Retrieve
        let userId = localStorage.getItem('rewardHub_userId');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('rewardHub_userId', userId);
        }

        // Sample Tasks List
        const tasks = [
            { id: 'phonepe', name: 'PhonePe', desc: 'Install & Open', reward: 5.00, link: 'https://play.google.com/store/apps/details?id=com.phonepe.app' },
            { id: 'paytm', name: 'Paytm', desc: 'Install & Open', reward: 5.00, link: 'https://play.google.com/store/apps/details?id=net.one97.paytm' },
            { id: 'gpay', name: 'Google Pay', desc: 'Install & Open', reward: 5.00, link: 'https://play.google.com/store/apps/details?id=com.google.android.apps.nbu.paisa.user' },
            { id: 'zomato', name: 'Zomato', desc: 'Install & Open', reward: 5.00, link: 'https://play.google.com/store/apps/details?id=com.application.zomato' },
            { id: 'swiggy', name: 'Swiggy', desc: 'Install & Open', reward: 5.00, link: 'https://play.google.com/store/apps/details?id=in.swiggy.android' }
        ];

        const todayStr = new Date().toISOString().slice(0, 10);

        // Render Tasks
        function renderTasks() {
            const taskListContainer = document.getElementById('taskList');
            taskListContainer.innerHTML = '';

            tasks.forEach(task => {
                const taskCard = document.createElement('div');
                taskCard.className = 'task-card';
                taskCard.innerHTML = `
                    <div class="task-info">
                        <h4>${task.name}</h4>
                        <p>${task.desc}</p>
                        <div class="task-reward">Earn ₹${task.reward.toFixed(2)}</div>
                    </div>
                    <button class="action-btn" id="btn_${task.id}">Start</button>
                `;
                taskListContainer.appendChild(taskCard);

                // Safe Event Listener with 15s Timer & Redirection
                document.getElementById('btn_' + task.id).addEventListener('click', function() {
                    const btn = document.getElementById('btn_' + task.id);
                    if (btn.innerText === 'Completed' || btn.disabled) return;

                    // 1. Open External Task Link
                    window.open(task.link, '_blank');

                    // 2. Set Button to Verifying State
                    btn.innerText = 'Verifying...';
                    btn.disabled = true;

                    // 3. Wait 15 seconds to simulate task verification, then complete
                    setTimeout(function() {
                        completeTask(task.id, task.reward);
                    }, 15000); // 15 seconds delay
                });

                // Listen status specifically for today's date
                db.ref('users/' + userId + '/completedTasks/' + todayStr + '/' + task.id).on('value', (snap) => {
                    const btn = document.getElementById('btn_' + task.id);
                    if (snap.val() === true && btn) {
                        btn.innerText = 'Completed';
                        btn.disabled = true;
                    }
                });
            });
        }

        // Complete Task & Update Wallet
        function completeTask(taskId, reward) {
            const taskRef = db.ref('users/' + userId + '/completedTasks/' + todayStr + '/' + taskId);
            
            taskRef.once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    taskRef.set(true);

                    // Update Balance in Firebase
                    const balanceRef = db.ref('users/' + userId + '/walletBalance');
                    balanceRef.transaction((currentBalance) => {
                        return (currentBalance || 0) + reward;
                    });
                }
            });
        }

        // Fetch Wallet Balance Real-time
        db.ref('users/' + userId + '/walletBalance').on('value', (snapshot) => {
            const balance = snapshot.val() || 0;
            document.getElementById('walletBalance').innerText = '₹' + balance.toFixed(2);
        });

        // Withdraw Request Function
        function requestWithdrawal() {
            db.ref('users/' + userId + '/walletBalance').once('value').then((snapshot) => {
                const balance = snapshot.val() || 0;
                if (balance >= 250) {
                    alert('Withdrawal request submitted successfully! Amount will be transferred soon.');
                } else {
                    alert('Insufficient balance! Minimum withdrawal amount is ₹250.00');
                }
            });
        }

        // Initialize App
        renderTasks();
    </script>
</body>
</html>
